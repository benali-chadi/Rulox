[package]
name = "rulox"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4.0"
env_logger = "0.9.0"
colored = "2"
futures = "0.3.28"
signal-hook = "0.3.15"
signal-hook-tokio = {version = "0.3.1", features = ["futures-v0_3"]}
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }
